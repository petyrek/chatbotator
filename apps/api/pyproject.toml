[project]
name = "chatbotator"
version = "0.1.0"
description = "TrailSupply support assistant API"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# `ruff format` keeps code within the line length; long string literals are allowed.
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests", "../../evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
